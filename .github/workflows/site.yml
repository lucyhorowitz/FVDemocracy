name: site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that lean.js matches the Lean source
        run: python3 site/extract.py --check

      - name: Collect the page files
        run: |
          mkdir _site
          cp site/index.html site/style.css site/content.js site/lean.js site/app.js _site/

      - if: github.event_name == 'push' || inputs.deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' || inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
